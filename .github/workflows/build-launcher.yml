name: Build LiteBrain Launcher

on:
  push:
    branches:
      - "prod"
    paths:
      - ".github/workflows/build-launcher.yml"   # only if this file changes 'versions'

permissions:
  contents: write   # necessary to create a Release

env:
  VERSION: "1.1.0"   # Change here to change the entire version.

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build LiteBrainLauncher with PyInstaller
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ICON="logo/lite-brain-logo.ico"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            ICON="logo/lite-brain-logo.icns"
          else
            ICON="logo/lite-brain-logo.png"
          fi

          pyinstaller launcher.py --onefile --name "LiteBrainLauncher" --icon "$ICON"

      - name: Rename binary with version
        shell: bash
        run: |
          mkdir output
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mv dist/LiteBrainLauncher.exe output/LiteBrainLauncher-${{ env.VERSION }}-windows.exe
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            mv dist/LiteBrainLauncher output/LiteBrainLauncher-${{ env.VERSION }}-linux
          else
            mv dist/LiteBrainLauncher output/LiteBrainLauncher-${{ env.VERSION }}-macos
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteBrainLauncher-${{ matrix.os }}
          path: output/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release with VERSION
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "LiteBrain Launcher v${{ env.VERSION }}"
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
